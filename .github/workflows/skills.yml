name: Sync and release skills

on:
  push:
    branches: [main]
    paths-ignore:
      - "skills/*/references/**"
      - ".obsidian/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skills-release
  cancel-in-progress: true

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync references and build zips
        run: bash scripts/package-skills.sh

      - name: Commit synced references
        run: |
          if [ -n "$(git status --porcelain skills)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add skills
            git commit -m "chore: sync skill references [skip ci]"
            git push
          else
            echo "references already in sync"
          fi

      - name: Publish zips to the 'skills-latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=skills-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Skills (latest)" --latest \
              --notes "Upload-ready skill zips, rebuilt automatically on every push to main. See README for install instructions."
          fi
          gh release upload "$TAG" dist/*.zip --clobber
